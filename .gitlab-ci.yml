
# Define a ordem das etapas do pipeline.
stages:
  - build
  - test
  - quality
  - docker
  - deploy

# Controla quando o pipeline será executado.
workflow:
  rules:
    # Executa em merge requests.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Evita pipelines duplicados quando existe merge request aberto.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never

    # Executa em outras branches.
    - if: '$CI_COMMIT_BRANCH'

# ==================================================
# 1. BUILD
# ==================================================

# Compila o frontend React com TypeScript.
build_frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Verifica a instalação e a sintaxe do backend.
build_backend:
  stage: build
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install -r requirements-dev.txt
    - python -m compileall -q app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ==================================================
# 2. TESTES
# ==================================================

# Executa os testes automatizados da API.
test_backend:
  stage: test
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install -r requirements-dev.txt
    - python -m pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ==================================================
# 3. QUALIDADE
# ==================================================

# Verifica a qualidade do código frontend.
lint_frontend:
  stage: quality
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Verifica a qualidade do código backend.
lint_backend:
  stage: quality
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install -r requirements-dev.txt
    - python -m ruff check app tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'


# ==================================================
# 4. DOCKER
# ==================================================

# Constrói e publica as imagens Docker no GitLab Container Registry.
docker_build:
  stage: docker
  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - docker info

  script:
    # Constrói a imagem do backend.
    - docker build -t "$CI_REGISTRY_IMAGE/biblioteca-backend:$CI_COMMIT_SHORT_SHA" ./backend

    # Constrói a imagem do frontend.
    - docker build --build-arg VITE_API_URL="$VITE_API_URL" -t "$CI_REGISTRY_IMAGE/biblioteca-frontend:$CI_COMMIT_SHORT_SHA" ./frontend

    # Faz login no Container Registry somente em pipelines de branch.
    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

        # Publica a imagem do backend.
        docker push "$CI_REGISTRY_IMAGE/biblioteca-backend:$CI_COMMIT_SHORT_SHA"

        # Publica a imagem do frontend.
        docker push "$CI_REGISTRY_IMAGE/biblioteca-frontend:$CI_COMMIT_SHORT_SHA"
      fi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'


# ==================================================
# 5. DEPLOY
# ==================================================

# Solicita ao Render a implantação do backend e frontend.
# Só será executado depois que os dois Deploy Hooks
# forem configurados nas variáveis do GitLab.
deploy_render:
  stage: deploy
  image: alpine:3.20

  needs:
    - job: docker_build

  before_script:
    - apk add --no-cache curl

  script:
    # Solicita a implantação do backend.
    - curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_BACKEND"

    # Solicita a implantação do frontend.
    - curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_FRONTEND"

  rules:
    - if: '$CI_COMMIT_BRANCH == "publicar-seguro" && $RENDER_DEPLOY_HOOK_BACKEND && $RENDER_DEPLOY_HOOK_FRONTEND'
